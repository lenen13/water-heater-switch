; 蓝牙热水器开关 —— WSP v1 固件（ESP32-C3 + NimBLE）
;
; 编译:  pio run
; 烧写:  pio run -t upload
; 串口看配对串:  pio device monitor        (115200)
;
; 首次烧写如果进不了下载模式：按住 BOOT(GPIO9) 再点 RST，然后重新执行 upload。

[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 如果用的是 ESP32-C3 SuperMini、且串口在烧写时反复断开，
; 把上面 upload_speed 改成 115200 再试一次。
