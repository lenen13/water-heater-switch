name: build-apk

# 说明：这个工作流在 GitHub 的服务器上编译 APK，你本地不需要装 Android SDK。
# 触发方式：仓库页面 Actions → build-apk → Run workflow；
# 或者往 main 分支推 web/ apk/ 相关改动时自动跑。
# 产物：Actions 运行详情页底部的 Artifacts → wsp-heater-debug-apk。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'apk/**'
      - 'tools/sync_site.mjs'
      - 'tools/patch_android.mjs'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：ubuntu-latest 运行器自带 Android SDK（$ANDROID_HOME=/usr/local/lib/android/sdk），
      # 不需要再装 android-actions/setup-android（那个 action 最近常在这一步失败）。
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: 同步网页到 apk/www 和 docs
        run: node tools/sync_site.mjs

      - name: 安装 npm 依赖
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: 生成 Android 工程
        working-directory: apk
        run: npx cap add android

      - name: 补蓝牙权限
        run: node tools/patch_android.mjs

      - name: 同步 web 资源到 Android 工程
        working-directory: apk
        run: npx cap sync android

      - name: 编译 debug APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: wsp-heater-debug-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
